name: Daily League New-Joiner Assignment

on:
  schedule:
    - cron: '0 12 * * *' # every day at 12:00 UTC — must match _dailyJoinHourUtc in league_scoring.dart
  workflow_dispatch: {} # manual trigger — testing or retrying a failed run

jobs:
  daily-join:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tools/league-rollover/package-lock.json

      - name: Install dependencies
        working-directory: tools/league-rollover
        run: npm ci

      - name: Assign pending new joiners
        working-directory: tools/league-rollover
        run: node assignNewJoiners.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
